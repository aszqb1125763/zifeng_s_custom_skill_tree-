# Gradle 内存设置
org.gradle.jvmargs=-Xmx2G -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
## 固定 JDK 25（多 JDK 并存时避免用错；本机 Java 25 = Liberica 25.0.2）
org.gradle.java.home=C:/Program Files/BellSoft/LibericaJDK-25

## 环境属性
# 新版 NeoForge 的版本号跟随 Minecraft（26.1.2.x → MC 26.1.2）
# Minecraft 版本必须与 Neo 版本一致，否则解析不到有效的 userdev 构件
minecraft_version=26.1.2
# Minecraft 版本范围：取任何正式版作为边界（前缀版本号，非 1.26 写法）
minecraft_version_range=[26.1,27)
# Neo 版本必须与 Minecraft 版本一致
neo_version=26.1.2.122
# Neo 版本范围
neo_version_range=[26.1,)
# 加载器版本范围只能用 FML 主版本作边界
loader_version_range=[4,)
# Parchment 映射（★ 26.1.2 暂不可用：maven.parchmentmc.org 上 parchment-26.1.2 / parchment-26.1 均 404，
# 最新只到 1.21.11）。Parchment 只影响开发时 IDE 里的形参名，不影响编译与运行。
# 等官方发布 26.1.2 映射后，取消注释并在 build.gradle 里恢复 parchment { } 块。
# parchment_minecraft_version=1.21.11
# parchment_mappings_version=2025.12.21-nightly-SNAPSHOT

## 模组属性
# ★ modid 与 1.20.1 / 1.21.1 保持一致 —— assets/lang 命名空间、存档键、配置文件名都不用改
#   必须匹配 [a-z][a-z0-9_]{1,63}
mod_id=zifeng_s_custom_skill_tree
mod_name=Zifeng Skill Tree
mod_license=MIT
# 与 1.20.1 / 1.21.1 版本线保持一致（三版本长期同步）
mod_version=1.5.5
mod_group_id=zifeng_s-custom-skill-tree
mod_authors=zifeng
mod_description=Zifeng Skill Tree for NeoForge 26.1.2 (Minecraft 26.1.2): turn surplus FE energy into skill points and unlock 153 skills across 11 categories.
